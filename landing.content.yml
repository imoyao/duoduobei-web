  heroSub: 我们为什么做这件事，以及，如何让它持续下去。
  blocks:
    - id: what
      kind: plain
      title: 多多贝是什么
      body: 多多贝是一款帮你（尤其是使用多账户、多平台购买基金理财产品的朋友）算清真实收益、让复利曲线清晰可见的投资账本。
      belief: 我们相信，认真地记账与复盘，是普通人做好投资的第一步。
      items:
        - 我的资产中有多少用于投资基金？它们分别是什么？
        - 这些投资在过程中带来了多少浮盈？又分别来自哪些产品（大浪淘沙，去伪存真）？
        - 我买的基金真的帮我实现了资产增值吗？我该选哪些、又该离场哪些？
    - id: origin
      kind: soft
      title: 缘起
      paragraphs:
        - 作为一个低风险（<del>小富即安</del>）投资者，一直有"钱都去哪儿了"的困扰。记账类 App 已经很多，但专门做好基金理财记账的，却始终没能让人满意。
        - >-
          网上看到 <a href="https://dbanotes.net/arch/caibangzi_web_arch.html" target="_blank" rel="noopener">财帮子</a>
          被网友念念不忘，便动了念头，想做一个真正好用的基金记账工具 —— Fund Manage Platform/Plan，项目曾暂定名为 <a href="https://github.com/imoyao/FMP"
          target="_blank" rel="noopener">FMP</a>。多多贝是它一步步长成今天的样子。
      storyLink:
        label: 完整品牌故事 →
        href: story.html
    - id: opensource
      kind: plain
      title: 关于开源
      paragraphs:
        - 本人是开源精神的受益者，也是拥护者。多多贝在创作过程中，离不开无数开源项目的分享。
        - >-
          同时，我们也理解当前开源社区普遍面临的现实：投入与回报常常不成正比，"开源 = 白嫖"的心态并不少见（可参阅 <a href="https://zhuanlan.zhihu.com/p/45653912"
          target="_blank" rel="noopener">京东抄我的开源程序怎么办？ - 知乎</a>、<a
          href="https://mp.weixin.qq.com/s/QsDhNDL3Vn93F4pNI7Yy7w" target="_blank" rel="noopener">Elasticsearch 与 Kibana
          更改开源协议 - 微信</a>）。因此，目前暂不开放整个软件的源码。如果你需要部分功能的实现思路，可以通过<a href="/donate/" target="_blank"
          rel="noopener">赞赏作者</a>或参与<a href="/todo/" target="_blank"
          rel="noopener">文档与建议贡献</a>的方式获取支持；相信通过这一系列记录文章，你也能有所收获。
      quote: 好的开源生态，需要享用便利的人也愿意回馈。单向的索取，只会让愿意分享的人越来越少。
    - id: sustain
      kind: coral
      tone: coral
      title: 如何持续下去
      paragraphs:
        - 谈开源，也绕不开怎么让一件事持久。多多贝会坚持<strong>基础记账功能（含账单导出）长期免费</strong>。但一款软件要持续维护，只靠热爱是不够的——
        - 所以我们选择了一条实在的路：
      links:
        - label: 为什么说「免费的其实是最贵的」？ - 知乎
          href: https://www.zhihu.com/question/22084816
        - label: 财帮子的所有者还打算继续办下去么？ - 知乎
          href: https://www.zhihu.com/question/29603361
        - label: 网易有钱 App 下线公告
          href: https://1.163.com/html/qian/web/5fdaffaed605e84a6d118cd4.html
        - label: 雪球"模拟盈亏"功能下线公告 - 雪球
          href: https://xueqiu.com/6123409880/150393232
      tip: 如果多多贝对你有帮助，我们鼓励你在能力范围内付费支持；如果觉得它一文不值，来去随宜，也完全没关系。付费与否，都不影响你使用免费的基础功能。
      quote: 如果用户没有付钱，那么用户往往就是商品。这也是我们坚持"基础免费、增值可选"的原因——不靠贩卖你的数据，而靠认可我们的人。
brandStory:
  heroTitle: 为什么做多多贝？
  heroSub: 阳光穿过浅海，照亮珊瑚森林；下潜 800 米，遇见在幽暗中保持平衡的鹦鹉螺。
  opening:
    paragraphs:
      - 阳光穿过透明的浅海，照亮了海底的珊瑚森林。枝杈在水流中缓缓摇摆，染出一片温暖而鲜活的珊瑚红。
  dive:
    paragraphs:
      - 镜头追随着这片光，开始从海面垂直下潜——光线被层层海水吞没，蓝色由浅及深，喧嚣逐渐归于沉寂。直到海面之下 800 米，这里是另一片天地：没有风，没有浪，只有无声涌动的暗流和足以碾碎金属的庞大水压。
      - 鹦鹉螺，就栖息在这片永恒的幽暗之中。
      - 它从不对抗深海的水压，而是用另一种方式回应这片环境：精密调控壳内三十余间气室的腔液与气体比例，在漆黑中保持着恰到好处的浮力。洋流的强弱起伏，日复一日，都化作它身上新生的壳体纹路。
  metaphor:
    paragraphs:
      - 我们每一个置身市场的人，何尝不是潜入自己的深海。市场的每一次脉冲，就是海面以上的狂风骤雨；而真实的资产价值，始终藏在水面之下的暗流中。账户里的浮盈浮亏，不过是海面偶尔翻起的浪花。
  thinking:
    paragraphs:
      - 很多人认为投资就是追着浪头跑，但我逐渐想明白了一件事：财富增长的上限，永远取决于你靠什么换钱。
      - 单纯出卖时间，天花板抬眼就能看到。想把资产做大，无非两条路：自己创业，或者让资本去生钱。两条路都不容易，但不管走哪条，前提都得先把账算明白。
      - 不知道真实的收益，就没法判断下一步该往哪走。对大多数普通人来说，投资是绕不开的一步。
  origin:
    paragraphs:
      - 于是我开始自问：那我到底该怎么做，才算是有备无患？
      - 答案很朴素——别急着预测下一个浪头，先把潮水涌来时自己到底站在哪算清楚。
      - 做多多贝的起点，是我自己首先算不清自己的账了。手里好几个券商和基金账户，满屏浮盈。涨潮时觉得自己是天才，退潮时才发现连资金进出都是一笔糊涂账。
      - >-
        于是我写了个极简的脚本。不直连账户，只导入交易记录
        CSV，输出一个最直接的数字：XIRR。它不跟市场脉搏跳动，只告诉你一个坐标——你真实的复利轨迹，到底在哪。算完之后，它还会把你的持仓结构摊开来看：单只标的占比是不是过高？波动有没有超出你能承受的底线？这些硬数据，比任何浮盈都更能回答一个问题——你到底安不安全。
  friend:
    paragraphs:
      - 后来我把它分享给一位朋友。他跟投了一个号称"十年十倍"的投资组合。
      - 结果数据拉出来，他盯着那个数字沉默了许久，然后叹了口气：
      - 八年折腾，收益还不如一笔三年期定期存款。原来一直都在闭着眼瞎投。
      - 但他停顿后补了一句："好在，今天总算不是裸泳了。"
      - 那一刻我意识到，对大多数人来说，真正需要的不是能预知市场的"神技"，而是看清市场真相后，那种不会再被潮水裹挟的定力。
  closing:
    paragraphs:
      - 多多贝，想成为帮你掌控那间"气室刻度"的标尺。
      - 我们不荐股、不跟单。所有数据由你手动录入或交割单导入，主权归你，随时可一键导出带走。我们不做带你追浪的弄潮儿，只用数据的事实说话，做一把诚实的度尺。
    rhyme:
      - 潮有涨落，壳有深浅。算得清，才无患。
legal:
  privacy:
    title: 隐私政策
    slug: privacy
    sections:
      - heading: 隐私政策
        paragraphs:
          - |-
            <strong>更新日期</strong>：2026 年 7 月 19 日
            <strong>生效日期</strong>：2026 年 7 月 19 日
          - 欢迎使用 <strong>多多贝</strong>（包括网站及相关的产品服务，以下简称“本产品”）。本产品由 <strong>imoyao</strong>（以下简称“我们”）开发并运营。
          - >-
            本产品是一个<strong>个人投资记账与资产分析工具</strong>，核心定位是<strong>数据本地存储、用户自主可控、不依赖云端服务</strong>。我们深知财务数据的敏感性和私密性，<strong>保护您的数据隐私是我们的首要原则</strong>。
          - >-
            请您在使用本产品前仔细阅读并充分理解本隐私政策的全部内容。一旦您选择使用，即视为您同意本政策。如您有任何疑问，可通过 <strong>&lt;imsantu@126.com&gt;</strong>
            或产品内的反馈渠道与我们联系。如您不同意本政策的任何条款，请停止使用本产品。
          - 本隐私政策将帮助您了解以下内容：
        items:
          - 我们如何收集和使用您的个人信息
          - 我们如何存储和保护您的个人信息
          - 我们如何共享、转让、公开披露您的个人信息
          - 您如何管理您的个人信息
          - 我们如何使用 Cookie 和其他追踪技术
          - 本政策的更新与联系方式
      - heading: 一、我们如何收集和使用您的个人信息
        paragraphs:
          - 个人信息是指以电子或者其他方式记录的能够单独或者与其他信息结合识别特定自然人身份或者反映特定自然人活动情况的各种信息。
          - 我们严格遵循<strong>合法、正当、必要</strong>的原则，仅在本产品正常运行所必需的范围内收集和使用您的个人信息。
          - '### 1.1 您主动提供的信息'
          - '### 1.2 我们自动收集的信息'
          - '### 1.3 我们<strong>不会</strong>收集的信息'
          - 我们<strong>不会</strong>收集以下类型的个人信息：
          - '### 1.4 信息收集的特别说明'
          - >-
            <strong>与商业记账软件不同，本产品的核心设计理念是“数据本地优先”</strong>。您的所有财务数据——包括持仓、交易、资产、负债等——<strong>默认仅存储在您本地设备的 SQLite
            数据库中</strong>。我们不会主动将您的数据上传至任何云端服务器，也不会在未经您明确授权的情况下通过网络传输您的财务数据。
          - 我们仅收集上述“1.1”和“1.2”中所述的最少量信息，用于产品的基本运行、账号管理和故障排查。<strong>您在使用过程中主动录入的财务数据，完全由您自己掌控。</strong>
        items:
          - <strong>注册信息</strong>：当您注册本产品账号时，您需要提供<strong>电子邮箱地址</strong>作为登录凭证。我们可能通过发送验证邮件的方式来验证您的身份。
          - >-
            <strong>资产与交易数据</strong>：您在使用本产品进行记账、资产录入、导入数据等操作时，您主动输入的<strong>投资持仓、交易流水、资产负债</strong>等财务数据。<strong>这些数据仅存储在您本地设备或您指定的存储位置，我们不会上传至任何云端服务器。</strong>
          - <strong>联系方式</strong>：如您通过邮件或产品内反馈渠道与我们联系，我们可能会保存您的联系方式及通信内容，以便处理您的问题。
          - <strong>设备基本信息</strong>：在您访问本产品时，我们可能会收集您的<strong>浏览器类型、操作系统版本、屏幕分辨率</strong>等基础信息，用于优化产品在不同设备上的显示效果。
          - <strong>日志信息</strong>：当您使用本产品时，我们可能会自动记录您的<strong>访问时间、访问页面、IP 地址</strong>等技术日志，用于排查产品故障和保障系统运行安全。
          - 您的真实姓名、身份证号、手机号码（注册仅需邮箱）
          - 您的生物识别信息（指纹、人脸等）
          - 您的通讯录、短信、通话记录
          - 您的精确地理位置
          - 您的设备唯一标识符（IMEI、Android ID、MAC 地址等）
      - heading: 二、我们如何存储和保护您的个人信息
        paragraphs:
          - '### 2.1 存储位置与期限'
          - '### 2.2 安全保护措施'
          - '### 2.3 数据导出与删除'
        items:
          - >-
            <strong>财务数据</strong>：您的资产、持仓、交易等财务数据<strong>默认存储在您本地设备的 SQLite
            数据库文件中</strong>，存储位置由您自行决定。您可以随时备份、导出或删除这些数据。
          - <strong>账号信息</strong>：您的注册邮箱等账号信息，我们会将其与您的本地数据库关联存储。
          - <strong>存储期限</strong>：我们仅在实现信息收集目的所需的最短时间内保留您的个人信息。当您主动注销账号或删除数据时，相关信息将被移除。
          - 我们使用符合业界标准的安全防护措施保护您的个人信息，并加密其中的关键数据，防止其遭到未经授权的访问、公开披露、使用、修改、损坏或丢失。
          - 我们会采取一切合理可行的措施保护您的个人信息。我们会使用加密技术确保数据的保密性。
          - <strong>由于本产品的财务数据默认存储在您的本地设备上，数据的安全性也取决于您自身对设备的保护</strong>（如设备密码、防病毒软件、数据备份等）。建议您定期备份本地数据库文件，以防设备故障导致数据丢失。
          - 您可以随时通过产品功能导出您的全部数据（支持标准格式导出）。
          - 如您确认不再使用本产品，并按照要求主动注销您的账号，您的相关数据将被删除。
      - heading: 三、我们如何共享、转让、公开披露您的个人信息
        paragraphs:
          - '### 3.1 我们不会与任何第三方分享您的个人信息'
          - <strong>我们承诺：我们不会将您的个人信息（包括财务数据）出售、出租、共享或转让给任何第三方，除非：</strong>
          - '### 3.2 以下情形中共享、转让、公开披露您的个人信息无需事先征得您的授权同意'
          - '### 3.3 第三方服务'
          - >-
            本产品目前<strong>不集成任何第三方 SDK 或第三方分析服务</strong>（如友盟、Google Analytics
            等），因此不存在第三方自动收集您个人信息的情况。如未来因业务需要引入第三方服务，我们会提前在本政策中说明，并征得您的同意。
        items:
          - 获得您的明确同意；
          - 法律法规另有规定；
          - 按政府主管部门的强制性要求（如传票、调查函等法律文件）。
          - 与国家安全、国防安全直接相关的；
          - 与公共安全、公共卫生、重大公共利益直接相关的；
          - 与犯罪侦查、起诉、审判和判决执行等直接相关的；
          - 出于维护您或其他个人的生命、财产等重大合法权益但又很难得到本人同意的；
          - 您自行向社会公众公开的个人信息；
          - 从合法公开披露的信息中收集个人信息的，如合法的新闻报道、政府信息公开等渠道；
          - 法律法规规定的其他情形。
      - heading: 四、您如何管理您的个人信息
        paragraphs:
          - 您对自己在本产品中的个人信息享有以下权利：
          - 如您需要行使上述权利，可通过产品内功能直接操作，或通过 <strong>&lt;imsantu@126.com&gt;</strong> 联系我们协助处理。
        items:
          - <strong>访问权</strong>：您可以随时查看您已录入的所有资产、持仓、交易等数据。
          - <strong>更正权</strong>：您发现信息有误时，可以随时修改更正。
          - <strong>删除权</strong>：您可以随时删除单条数据，或导出全部数据后删除整个数据库。
          - <strong>导出权</strong>：您可以随时将全部数据导出为标准格式文件，自行保管或迁移。
          - <strong>注销权</strong>：您可以随时注销您的账号，注销后相关数据将被删除。
      - heading: 五、我们如何使用 Cookie 和其他追踪技术
        paragraphs:
          - 为确保产品正常运转，我们可能会在您的浏览器中存储名为 Cookie 的小数据文件。Cookie 通常包含标识符、产品名称以及一些号码和字符。
          - 借助于 Cookie，我们能够：
          - >-
            我们<strong>不会</strong>将 Cookie 用于本政策所述目的之外的任何用途。您可根据自己的偏好管理或删除 Cookie。大部分浏览器都提供阻止或禁用 Cookie 的功能。但请注意，禁用
            Cookie 后可能影响您正常使用本产品的部分功能。
        items:
          - 存储您的登录状态，使您无需在每次访问时重复登录；
          - 存储您的偏好设置（如页面布局、语言等）；
          - 提升产品服务质量和用户体验。
      - heading: 六、本政策的更新与联系方式
        paragraphs:
          - '### 6.1 政策更新'
          - 我们可能会根据法律法规的变化、产品功能的更新或业务发展的需要，对本隐私政策进行修订。修订后的政策将在本页面公布，并通过产品内通知等方式提醒您。
          - <strong>对于重大变更</strong>（如个人信息处理目的、处理方式的改变，或数据共享范围的扩大等），我们会以更显著的方式（如弹窗、邮件通知）告知您，并获得您的重新同意。
          - 本政策的<strong>最新版本</strong>始终发布于产品官网的 `/privacy` 页面，请您定期查阅。
          - '### 6.2 联系我们'
          - 如您对本隐私政策有任何疑问、建议或投诉，可通过以下方式联系我们：
          - 我们将在收到您的反馈后 <strong>15 个工作日内</strong>予以回复。
          - <strong>本政策自 2026 年 7 月 19 日起生效。</strong>
        items:
          - <strong>电子邮箱</strong>：&lt;imsantu@126.com&gt;
          - <strong>产品内反馈渠道</strong>：您可以通过产品内的反馈功能提交您的问题
        quote: <strong>温馨提示</strong>：本产品为本地优先的个人投资记账工具，您的财务数据默认存储在您自己的设备上。我们建议您定期备份本地数据库文件，以防设备故障导致数据丢失。数据安全，从备份开始。
  donate:
    title: 赞赏支持
    slug: donate
    sections:
      - heading: 帮助我们走得更远
        paragraphs:
          - 作为个人开发者，前期服务器、域名等服务支出都是本人“靠爱发电”的。虽然一直“白嫖”一直爽，但是要想网站长久运行下去，本人需要付出<strong>大量</strong>的时间优化功能以及进行日常功能维护。
