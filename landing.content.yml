scenarios:
  eyebrow: 适用场景
  title1: 每个投资者，
  title2: 各有一套
  lead: 不同的人，同一个问题：我的真实收益到底是多少？多多贝覆盖多种投资场景，选择适合你的用法。
  items:
    - tone: coral
      icon: monitor
      tag: 独立开发者 · FIRE 践行者
      title: 数据主权优先
      desc: 不连券商，数据存在云端、主权归你。XIRR 算出来那一刻，就知道这半年折腾到底值不值。
      kit: 开发者专属工作流
    - tone: blue
      icon: user
      tag: 上班族 · 基金定投
      title: 家人也能看懂
      desc: 推荐给父母记基金，第一次看懂真实收益率。以前只知道「赚了」或「亏了」，现在能说出具体数字——原来那只「明星基」其实跑输通胀。
      kit: 家庭记账套件
    - tone: green
      icon: users
      tag: 追牛猎手 · 多账户持有者
      title: 三个券商合并算
      desc: 三个券商的账户记了大半年，以前每家说的收益都不一样，搞不清哪个对。现在合并在一起算，终于知道退休金的真实回报率是多少。
      kit: 多账户归集
    - tone: purple
      icon: activity
      tag: 混合投资者 · 股票+基金
      title: 分红再投不再盲区
      desc: 分红再投一直是我记账的盲区，手动算成本太麻烦。多多贝把分红自动纳入 XIRR 计算，省了每周日对账的时间。
      kit: 全类型交易记录
    - tone: amber
      icon: file
      tag: 财务爱好者 · 记账达人
      title: 算法透明不玩黑盒
      desc: 同花顺显示 12.69% 却不解释怎么算出来的。多多贝 XIRR 口径透明、精确到日，每笔现金流可追溯，账算得清清楚楚。
      kit: 专业复盘工具
    - tone: teal
      icon: lock
      tag: 隐私敏感型用户
      title: 零广告零追踪
      desc: 受够了 App 开屏广告和信息流推荐？多多贝无广告、不开屏、不荐股、不导流理财。商业模式不依赖你的注意力。
      kit: 隐私优先设计
    - tone: blue
      icon: grad-cap
      tag: 学生 · 理财新手
      title: 第一笔定投从零算
      desc: 第一次记账也能看懂。XIRR 自动算，定投成本一笔笔摊平，少走新手弯路，不被「复利神话」忽悠。
      kit: 新手起步套件
    - tone: amber
      icon: refresh
      tag: 可转债爱好者
      title: 打新与转股记录
      desc: 可转债的申购、转股、赎回各有成本。全类型流水可记，成本一笔笔并入 XIRR，转股时的真实收益也能算清。
    - tone: green
      icon: layers
      tag: 指数基金党 · ETF 定投
      title: 定投成本摊薄
      desc: 周定投、月定投的成本怎么摊？XIRR 自动加权，看清定投的真实年化回报，而不是被「微笑曲线」带节奏。
    - tone: teal
      icon: shield-check
      tag: 长期持有 · 养老年金
      title: 穿越牛熊的回报
      desc: 长期持有的年金，用 XIRR 看穿越周期的真实年化——不是某一年暴涨的数字，是十年里每一笔的加权。
      kit: 长期视角
explore:
  eyebrow: 免费探市
  title: 免费的市场温度计
  lead: 不登录也能看。我们聚合公开市场数据，把复杂情绪凝成一眼可读的温度——恐慌与贪婪，都写在刻度上。
  items:
    - icon: trending-up
      title: 市场温度计
      desc: 恐惧 / 贪婪、股债利差、整体估值，一目了然的水温表。
    - icon: activity
      title: 多维情绪
      desc: 恐慌贪婪、市场情绪、风险偏好，聚合多源公开数据。
    - icon: shield-check
      title: 基础指标免费
      desc: 净值、PE / PB 估值、股债利差等公开数据，免登录随时看。
    - icon: lock
      title: 高级洞察登录后可见
      desc: 行业拥挤度、乖离率等自建指标，登录后解锁，不看也能免费逛。
  ctaTemperature: 看市场温度
  ctaExplore: 进入探市
  note: 基础数据免费免登录；自建分析指标（行业拥挤度 / 乖离率）需登录后查看。
compare:
  eyebrow: 为什么不同
  title: 同样是投资记账，差距在算得准不准
  lead: 我们不替你做决定，只把真实收益算到你能看懂。这是多多贝和同类产品最本质的区别。
  col1: 能力
  colUs: 多多贝
  colOther: 普通记账 App
  rows:
    - capability: XIRR 真实年化（精确到日）
      us: ✓ 内置计算
      other: ✗ 多只看累计收益
    - capability: 多账户合并真实收益率
      us: ✓ 支持
      other: ✗ 多为单账户视图
    - capability: 不连接券商、不自动抓取
      us: ✓ 数据在你手里
      other: ⊘ 需授权读取账户
    - capability: 广告 / 开屏 / 荐股
      us: ✓ 全无
      other: ⊘ 部分含广告或理财引导
    - capability: 交易记录一键导出
      us: ✓ CSV 自由导出
      other: ⊘ 导出受限或付费
    - capability: 收益率算法透明（XIRR 资金加权，精确到日）
      us: ✓ 口径透明 + 每笔现金流可追溯
      other: ✗ 单一黑盒数值，不解释算法
honesty:
  eyebrow: 诚实承诺
  title: 我们选择说实话，即使这并不讨好
  lead: 很多产品只展示自己好的一面。我们觉得，你应该知道这个工具擅长什么、不擅长什么。
  items:
    - icon: activity
      cls: ''
      title: 计算口径诚实
      desc: XIRR 精确到日、资金加权，不含未实现浮盈的误导性美化。我们算的是你真实的持仓回报率，不是模拟出来的漂亮数字。
    - icon: shield
      cls: ''
      title: 数据主权
      desc: 数据存于云端，主权归你：交易记录一键导出 CSV、随时可带走，也不用于任何营销或广告。你的交易记录，由你掌控。
    - icon: rect
      cls: ''
      title: 不靠广告变现
      desc: 无开屏广告、无信息流广告、不导流理财。我们的商业模式不依赖你的注意力，所以不需要用广告打断你。
    - icon: circle-x
      cls: ''
      title: 不荐股不跟单
      desc: 纯工具，不做个性化投资建议，不做跟单社区。我们不告诉你买什么卖什么——那是你的决定，不是我们的。
    - icon: file-text
      cls: ''
      title: 算法透明
      desc: 同口径同步展示 XIRR（资金加权，精确到日），每笔现金流与每日资产变动都可追溯。基于公开标准（Excel XIRR 同源），不会偷偷调整算法来美化你的收益曲线。算就是算，不玩花活。
    - icon: info
      cls: limitation
      title: 我们也做不到的事
      desc: 不支持期货/加密货币实时估值；分红再投需手动标记；不支持自动同步券商交割单（这是刻意的设计选择，不是技术限制）。这些已知边界会持续公开。
story:
  title: 为什么做这件事
  lead: 我们每一个置身市场的人，何尝不是潜入自己的深海。市场的脉冲是海面上的狂风骤雨，而真实的资产价值，始终藏在暗流里。
  ctaLabel: 读品牌故事
  ctaHref: story.html
  sidebarTitle: 我们的立场
  sidebarText: 我们不荐股、不跟单、不替市场下结论——只把客观数据摆在你面前。买还是卖？你自己判断。
pro:
  eyebrow: 专业复盘
  title: 大厂工具缺的那口气，我们补上
  lead: 主流券商 App 的账本能算收益，但从不在意你怎么看懂它。专业用户值得更诚实的复盘——算得清，也要说得清。
  items:
    - icon: info
      title: 算法公开，每一步可追溯
      desc: 同口径同步展示 XIRR（资金加权，精确到日），并追溯每笔现金流与每日资产变动。不再有"这个 12.69% 到底怎么算的"这种疑问。
    - icon: chart
      title: 回撤分布曲线，不只是极值
      desc: 不只标一个"最大回撤"。绘制连续回撤曲线，让你看到一波波行情中每次颠簸的轮廓——真正有用的不是最惨的那一次，是分布。
testimonials:
  eyebrow: 用户怎么说
  title: 不同的人，同一个问题：我的真实收益到底是多少？
  items:
    - avatar: 周
      name: FIRE路上的老周
      role: 独立开发者 · FIRE理念践行者
      quote: 我最在意的就一件事：数据主权。多多贝不连券商，数据虽然在云端，但是归我自己掌控，随时可以导出保存本地。XIRR 一出来，我才知道这半年瞎折腾到底值不值。
    - avatar: 琳
      name: 养基少女Linda
      role: 上班族 · 基金投资者
      quote: 我让我妈用多多贝记基金，她头一回看清自己的真实收益率。以前她只会说'赚'或'亏'，现在能报出具体数字——那只被吹上天的'明星基'，其实连通胀都没跑赢。
    - avatar: 张
      name: 爱记账的张阿姨
      role: 退休大妈 · 多账户持有者
      quote: 我三个券商的账户记了小半年，每家报的收益都不一样，越看越糊涂。合到一块儿一算，我才弄清退休金真实的年化回报到底是多少。
    - avatar: 陈
      name: 量化民工阿Chen
      role: 朋友 · 股票+基金混合
      quote: 分红再投以前是我记账的死角，手动摊成本太费劲。多多贝把分红自动算进 XIRR，我周日再也不用趴桌上对账了。
privacy:
  eyebrow: 隐私与技术
  title: 你的数据，只属于你
  lead: 多多贝不自动抓取任何账户信息，所有数据由你手动录入或从交割单导入（CSV / PDF 解析）。
  items:
    - icon: bell-off
      title: 不自动抓取
      desc: 不连接任何券商账户，不在未授权下存储任何账户密码或令牌。
    - icon: lock
      title: 不用于营销
      desc: 你的交易数据不会被用于广告投放或商业分析。
    - icon: user-plus
      title: 不向第三方共享
      desc: 你的数据不会被出售或提供给任何第三方服务。
    - icon: download
      title: 支持一键导出
      desc: 随时导出交易记录（CSV），数据始终在你手里。
