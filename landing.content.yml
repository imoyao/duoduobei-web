features:
  eyebrow: 核心能力
  title1: 六大核心能力，
  title2: 算清你的投资账本
  lead: 从归集到复盘，每一步都围绕一个目标：让你看到真实的收益数字。
core:
  - num: '01'
    tone: coral
    icon: layers
    title: 多账户归集合并
    desc: 股票、基金、理财散落在不同券商和平台，总收益一笔糊涂账。手动归集全量资产与交易，合并计算真实收益率——不再需要三个 App 反复切换对账。
  - num: '02'
    tone: fall
    icon: trending-up
    title: XIRR 精确年化
    desc: 券商 App 的「累计收益」只是个绝对值，不反映资金进出的时间。自动算 XIRR（精确到日），真实的年化收益一眼就能看清。
  - num: '03'
    tone: coral-light
    icon: list
    title: 全交易类型记录
    desc: 分红、配股、手续费、逆回购……每一笔都影响真实成本。全类型记录，成本一笔笔算准，全部纳入 XIRR 计算。
  - num: '04'
    tone: coral
    icon: upload
    title: 免密码交割单导入
    desc: 上传 CSV / PDF 交割单即可导入，无需输入券商账号密码。支持支付宝、天天基金、同花顺等主流平台，更多平台持续接入——数据怎么来，你说了算。
  - num: '05'
    tone: fall
    icon: info
    title: 算法透明可追溯
    desc: 同口径展示 XIRR（资金加权，精确到日），每笔现金流与每日资产变动都可追溯。基于公开标准（Excel XIRR 同源），不偷偷调算法美化收益。
  - num: '06'
    tone: coral-light
    icon: shield
    title: 数据主权保障
    desc: 数据存在云端，主权归你：交易记录一键导出 CSV、随时可带走；无广告、不开屏、不荐股、不导流理财。你的交易记录，由你掌控。
